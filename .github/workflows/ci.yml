name: CI

# 全站质量门禁与自动化部署流水线：
# 1. 类型 / ESLint / 数据完整性与对比度单测 / 元数据可复现性
# 2. 静态导出构建与首屏 gzip 体积预算 + 产物自检
# 3. Lighthouse（性能 / 无障碍 / 最佳实践 / SEO 预算门禁）
# 4. 部署到 Cloudflare Pages（复用构建产物，兼容仓库未配 Secret 时的本机直推模式）
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型 / 规范 / 数据完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: 数据完整性 + 对比度 + 简繁映射
        run: npm test
      # 可复现产物一致性：重新生成后与提交版本必须逐字节一致，
      # 防止有人手工改 metadata.json 而生成器不同步（或反过来）。
      - name: 生成器与提交数据一致
        run: |
          node scripts/gen-metadata.mjs
          git diff --exit-code -- src/data/chapters/metadata.json

  build:
    name: 构建与体积预算
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # OG 图生成依赖中文字体（sharp/librsvg），Ubuntu 默认无 CJK 字体
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 静态构建与冗余载荷清理
        run: npm run build
        env:
          # 绑定自定义域名后在仓库变量里改 SITE_URL 即可；未设时安全回退默认域名
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://zhuangzi-site.pages.dev' }}
      # 防止首屏体积悄悄回退（章节页曾达 471KB gzip）
      - name: 首屏体积预算
        run: npm run budget
      - name: 产物自检
        run: node scripts/check-output.mjs
      - name: 章节页回归断言
        run: node scripts/check-passage-regression.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7

  lighthouse:
    name: Lighthouse（性能 / 无障碍 / SEO）
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ubuntu Runner 默认无任何中文系统回退字体（fc-list :lang=zh 为空），
      # 会导致 font-display: swap 首帧无可回退字形而挂起 FCP；安装轻量文泉驿
      # 系统回退字体（不命中 local("Noto Serif SC")，仍真实测试 woff2 分片网络体积）
      - name: 安装基础中文系统回退字体
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-wqy-microhei
      - name: 启动静态服务器
        run: |
          npx --yes serve out -l 4173 &
          npx --yes wait-on http://localhost:4173 -t 60000
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
            http://localhost:4173/chapters/
            http://localhost:4173/chapters/01-xiaoyao-you/
            http://localhost:4173/concepts/xiaoyao/
          budgetPath: ./.github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    name: 部署到 Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, build, lighthouse]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out
      - name: 检查 Cloudflare 部署凭据
        id: cf_creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ℹ️ 跳过 GitHub Runner 端自动上传"
              echo "仓库尚未配置 \`CLOUDFLARE_API_TOKEN\` 与 \`CLOUDFLARE_ACCOUNT_ID\` Secrets；"
              echo "构建产物 \`out/\` 已通过全套校验与 Lighthouse 门禁，支持本机 OAuth 凭据直推（\`npm run deploy\`）。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 推送至 Cloudflare Pages
        if: steps.cf_creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name zhuangzi-site
