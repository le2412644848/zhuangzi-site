name: CI

# 全站质量门禁与自动化部署流水线：
# 1. 类型 / ESLint / 数据完整性与对比度单测 / 元数据可复现性
# 2. 静态导出构建与首屏 gzip 体积预算 + 产物自检
# 3. Lighthouse（性能 / 无障碍 / 最佳实践 / SEO 预算门禁）
# 4. 部署到 Cloudflare Pages（复用构建产物，兼容仓库未配 Secret 时的本机直推模式）
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型 / 规范 / 数据完整性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      # 此前 CI 的 verify 不跑 validate-data（只在 build 里跑），与本地 npm run verify 不一致
      - name: 数据 schema 校验
        run: node scripts/validate-data.mjs
      - name: 单元测试（数据完整性 / 对比度 / 简繁 / Service Worker / 边缘函数）
        run: npm test
      # 可复现产物一致性：重新生成后与提交版本必须逐字节一致，
      # 防止有人手工改 metadata.json 而生成器不同步（或反过来）。
      - name: 生成器与提交数据一致
        run: |
          node scripts/gen-metadata.mjs
          git diff --exit-code -- src/data/chapters/metadata.json

  build:
    name: 构建与体积预算
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 不再 needs: verify —— 两者互不依赖，并行跑可把总时长缩短一个 job；
    # 部署仍要求 verify / build / lighthouse 全部通过。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Next 增量构建缓存（未命中时不影响正确性）
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # OG 图生成依赖中文字体（sharp/librsvg），Ubuntu 默认无 CJK 字体
      - name: 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 静态构建与冗余载荷清理
        run: npm run build
        env:
          # 绑定自定义域名后在仓库变量里改 SITE_URL 即可；未设时安全回退默认域名
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://zhuangzi-site.pages.dev' }}
      # 防止首屏体积悄悄回退（章节页曾达 471KB gzip）
      - name: 首屏体积预算
        run: npm run budget
      - name: 产物自检
        run: node scripts/check-output.mjs
      - name: 章节页回归断言
        run: node scripts/check-passage-regression.mjs
      # 真实 Chrome（Runner 自带）打开产物：无控制台报错 / 无 CSP 违规 / 客户端路由 / SW 离线回放
      - name: 浏览器冒烟
        run: npm run smoke
      - uses: actions/upload-artifact@v7
        with:
          name: out
          path: out/
          retention-days: 7
          if-no-files-found: error

  lighthouse:
    name: Lighthouse（性能 / 无障碍 / SEO）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Ubuntu Runner 默认无任何中文系统回退字体（fc-list :lang=zh 为空），
      # 会导致 font-display: swap 首帧无可回退字形而挂起 FCP；安装轻量文泉驿
      # 系统回退字体（不命中 local("Noto Serif SC")，仍真实测试 woff2 分片网络体积）
      - name: 安装基础中文系统回退字体
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-wqy-microhei
      - name: 启动静态服务器
        run: |
          npx --yes serve@14 out -l 4173 &
          npx --yes wait-on@8 http://localhost:4173 -t 60000
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
            http://localhost:4173/chapters/
            http://localhost:4173/chapters/01-xiaoyao-you/
            http://localhost:4173/concepts/xiaoyao/
          runs: 3
          # 体积/时间预算与分类得分断言合在一个文件里（LHCI 的 budgetsFile 与 assertions 互斥）。
          # 得分只设宽松下限：无障碍/SEO ≥ 0.95、最佳实践 ≥ 0.9 失败；性能 < 0.6 仅警告。
          # 计时类取 3 次里最好的一次，避免 Runner 抖动误报。
          # 门槛口径（逍遥游页，serve@14 + 文泉驿回退字体实测）：
          # · 样式表 26 KB / 文档 100 KB：@font-face 声明已从每页 HTML 挪进共享样式表
          #   （样式表 16.6→24.5 KB，文档 50.8→34.5 KB，合计更小且跨页缓存），预算随之平移并收紧文档。
          # · LCP 3300 ms：Lantern 模拟把「首帧上屏前已开始求值的 async 脚本」整体计为阻塞。
          #   本地零延迟下脚本求值与首帧上屏只差几毫秒，落在哪一侧会让模拟值在 2.7–3.15 s 间跳变
          #   （实测首帧并未变慢），门槛按含脚本的口径留 5% 余量。
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    name: 部署到 Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, build, lighthouse]
    timeout-minutes: 10
    # 同一时刻只允许一个部署，且不取消进行中的部署（避免留下半截发布）
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # 必须检出仓库：wrangler 从工作目录读取 functions/ 与 wrangler.toml。
      # 此前这里只下载 out/ 产物，CI 发布出去的站点**不带 /api/chat 边缘函数**。
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            functions
            wrangler.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - name: 检查 Cloudflare 部署凭据
        id: cf_creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ℹ️ 跳过 GitHub Runner 端自动上传"
              echo "仓库尚未配置 \`CLOUDFLARE_API_TOKEN\` 与 \`CLOUDFLARE_ACCOUNT_ID\` Secrets；"
              echo "构建产物 \`out/\` 已通过全套校验与 Lighthouse 门禁，支持本机 OAuth 凭据直推（\`npm run deploy\`）。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 推送至 Cloudflare Pages
        if: steps.cf_creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name zhuangzi-site
